# Version pin ledger
#
# Rule: no entry here comes from training data or memory. Every version is
# read from the vendor's current download/release page or directly from
# the live instance at the time it is pinned.
#
# NOTE ON ARCHITECTURE PIVOT:
# The initial plan targeted OCI Always Free VM.Standard.A1.Flex (Ampere Altra ARM64 / aarch64).
# Terraform apply failed with "500-InternalError: Out of host capacity" across all 3 ADs
# in us-chicago-1. We pivoted to VM.Standard.E5.Flex (AMD EPYC Genoa x86_64).
# This invalidated all aarch64 build/compilation hypotheses: all Python binary wheels
# installed as pre-built manylinux x86_64 wheels rather than requiring ARM-specific compilation.

architecture: x86_64
cpu_model: AMD EPYC 9J14 96-Core Processor
kernel: 5.15.0-1070-oracle #76-Ubuntu SMP x86_64
os_release: Ubuntu 22.04.5 LTS

name: terraform-provider-oci
version: 9.0.0
source_url: https://registry.terraform.io/providers/oracle/oci/9.0.0
date_pinned: 2026-09-07

